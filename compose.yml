services:
    postgres:
        image: postgres:16
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: root
            POSTGRES_DB: petshop
        ports:
            - "5432:5432"
        volumes:
            - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
    pgdata:
